[project]
name = "gauntlet"
version = "0.1.0"
description = "Play Magic: The Gathering games between agents, at speed, with a transcript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "claude-agent-sdk>=0.2.157",
    "typer>=0.12",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test here should take a second. One that hangs is a bug in the test or in
# the thing it is testing, and either way it must fail rather than block CI.
timeout = 60
markers = [
    "slow: takes more than a moment, excluded from the default run",
    "forge: needs a real Forge install, skipped when absent",
]

[tool.coverage.run]
source = ["src/gauntlet"]
branch = true

[tool.coverage.report]
# A floor that only moves up. A change adding untested code should not be
# quietly accepted.
#
# CI passes --cov-fail-under explicitly as well, because this setting alone
# makes coverage print FAIL without making pytest exit non-zero. Keep the
# two in step: this one is the local default, that one is the gate.
fail_under = 78
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Import-time guards for optional dependencies. Exercising them means
    # uninstalling a package mid-run, which is not worth the machinery.
    "except ImportError",
]
