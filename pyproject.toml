[project]
name = "gauntlet"
version = "0.1.0"
description = "Play Magic: The Gathering games between agents, at speed, with a transcript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "claude-agent-sdk>=0.2.157",
    "typer>=0.12",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
